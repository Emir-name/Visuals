name: Build mod

on:
  push:
    branches: [ "main", "arena/01a0a4b0-visuals" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # No local gradlew wrapper is committed, so we install Gradle directly
      # and run the Fabric Loom build with it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build mod jar
        run: |
          gradle build --no-daemon --stacktrace 2>&1 | tee gradle_output.log
          exit "${PIPESTATUS[0]}"

      # Report what Loom says about the access widener (as annotations, since
      # the raw log host is unreachable from some clients).
      - name: Report access widener status
        if: always()
        run: |
          grep -iE "access.?widener" gradle_output.log | head -10 | while IFS= read -r line; do
            echo "::notice title=AW::$line"
          done
          echo "::notice title=AW::access-widener report done"

      # Surface compile errors as check-run annotations so they are readable
      # via the API even when the raw log host is unreachable.
      - name: Surface compile errors as annotations
        if: failure()
        run: |
          grep -E "\.java:[0-9]+: error|error:|FAILED|Could not" gradle_output.log | head -60 | while IFS= read -r line; do
            echo "::error title=build error::$line"
          done

      # Post the tail of the full log to the most recent merged PR on failure.
      - name: Comment failure log on latest PR
        if: failure()
        run: |
          pr_number=$(gh pr list --state merged --limit 1 --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$pr_number" ]; then
            {
              echo "## CI failure log (last ~55KB) - run ${{ github.run_id }}"
              echo '```'
              tail -c 55000 gradle_output.log
              echo '```'
            } > failure_comment.md
            gh pr comment "$pr_number" --body-file failure_comment.md
          fi

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: ImpactVisuals-jar
          path: build/libs/*.jar

      # Publish the fresh jar to a dedicated ci-jar branch so it can be
      # fetched without artifact-download access. NOTE: this only works when
      # the repo's Actions workflow permissions are "Read and write" (the
      # default token is read-only here, in which case this step reports a
      # warning and the run still succeeds - the artifact upload above is
      # the fallback delivery channel).
      - name: Publish jar to ci-jar branch
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          jarfile=$(ls build/libs/impactvisuals-*.jar | grep -v sources | head -1)
          cp "$jarfile" impactvisuals-jar-ci.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add impactvisuals-jar-ci.jar
          if ! git diff --cached --quiet; then
            git commit -m "CI: prebuilt jar from run ${{ github.run_id }}"
            if git push origin HEAD:refs/heads/ci-jar --force 2>&1 | tee push_log.txt; then
              echo "::notice title=publish::ci-jar pushed OK"
            else
              echo "::warning title=publish::push failed (token read-only?): $(head -3 push_log.txt | tr '\n' ' | ')"
            fi
          fi

      # Diagnostics: step conclusions + log tail, surfaced as annotations so
      # they are readable even when the raw log host is unreachable.
      - name: Diagnostics (steps + log tail)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::notice title=diag::=== step conclusions ==="
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '.jobs[].steps[] | "\(.name): \(.conclusion)"' 2>/dev/null | while IFS= read -r line; do
              echo "::notice title=diag::$line"
            done
          echo "::notice title=diag::=== log tail (last 20KB) ==="
          tail -c 20000 gradle_output.log 2>/dev/null | head -c 19000 | while IFS= read -r line; do
            echo "::notice title=log::$line"
          done
          echo "::notice title=diag::=== end ==="
